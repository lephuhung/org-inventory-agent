name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version đánh số release (vd 1.2.0 — tag v<version> sẽ được tạo)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
            TAG="v$V"
          else
            TAG="${GITHUB_REF_NAME}"
            V="${TAG#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pin version from tag
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $csproj = "src/OrgInventoryAgent/OrgInventoryAgent.csproj"
          (Get-Content $csproj -Raw) `
            -replace '<Version>[^<]*</Version>', "<Version>$v</Version>" `
            -replace '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$v.0</AssemblyVersion>" `
            -replace '<FileVersion>[^<]*</FileVersion>', "<FileVersion>$v.0</FileVersion>" |
            Set-Content $csproj -NoNewline -Encoding utf8
          $wxs = "installer/Product.wxs"
          (Get-Content $wxs -Raw) -replace 'Version="[\d.]+"', "Version=`"$v`"" |
            Set-Content $wxs -NoNewline -Encoding utf8
      - name: Build MSI
        shell: pwsh
        run: .\installer\build-msi.ps1
      - name: Sign MSI (nếu có cert)
        if: ${{ vars.MSI_CERT_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature installer\OrgInventoryAgent.msi
          if ($sig.Status -ne 'Valid') {
            Write-Host "Ký MSI bằng cert thumbprint từ vars.MSI_CERT_THUMBPRINT"
            & signtool sign /sha1 "${{ vars.MSI_CERT_THUMBPRINT }}" /fd sha256 /tr http://timestamp.digicert.com /td sha256 installer\OrgInventoryAgent.msi
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
            # Cập nhật sha256 sau khi ký (ký làm đổi binary)
            $h = (Get-FileHash installer\OrgInventoryAgent.msi -Algorithm SHA256).Hash.ToLower()
            "$h  OrgInventoryAgent.msi" | Set-Content installer\OrgInventoryAgent.msi.sha256 -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/OrgInventoryAgent.msi
            installer/OrgInventoryAgent.msi.sha256
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm dpkg-dev
      - name: Pin version from tag
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i \
            -e "s|<Version>[^<]*</Version>|<Version>$V</Version>|" \
            -e "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$V.0</AssemblyVersion>|" \
            -e "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$V.0</FileVersion>|" \
            linux/src/OrgInventoryAgent.Linux/OrgInventoryAgent.Linux.csproj
          sed -i "s|^Version:.*|Version: $V|" installer/linux/debian/control
          sed -i "s|^Version:.*|Version:        $V|" installer/linux/rpm/orginventory.spec
      - name: Build self-contained binaries
        run: |
          V="${{ needs.version.outputs.version }}"
          ./installer/linux/build-linux.sh dist
          for RID in linux-x64 linux-arm64; do
            mv "dist/$RID/OrgInventoryAgent" "dist/$RID/OrgInventoryAgent-$RID"
            (cd "dist/$RID" && sha256sum "OrgInventoryAgent-$RID" > "OrgInventoryAgent-$RID.sha256")
            echo "$V" > "dist/$RID/OrgInventoryAgent-$RID.version"
          done
      - name: Build deb + rpm
        run: |
          ./installer/linux/build-deb.sh linux-x64 dist
          ./installer/linux/build-rpm.sh linux-x64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  release:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: assets
      - name: Manifest agent-version.json
        run: |
          V="${{ needs.version.outputs.version }}"
          cat > assets/agent-version.json <<EOF
          {"msi_version": "$V", "linux": {"linux-x64": "$V", "linux-arm64": "$V"}, "velociraptor_msi_version": null}
          EOF
          cat assets/agent-version.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "OrgInventory Agent $TAG" \
            --generate-notes \
            assets/* \
            installer/install.sh \
            installer/install.ps1 \
            installer/install-both.ps1 \
            installer/offline/install-offline.ps1 \
            installer/offline/install-offline.cmd
