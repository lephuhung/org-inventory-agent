name: release

# Pipeline release .NET — giữ lại chạy TAY qua workflow_dispatch. Tag `v*`
# giờ thuộc về rust-beta.yml (Rust agent thay thế .NET trong kênh release).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version đánh số release (vd 1.2.0 — tag v<version> sẽ được tạo)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
            TAG="v$V"
          else
            TAG="${GITHUB_REF_NAME}"
            V="${TAG#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pin version from tag
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $csproj = "src/OrgInventoryAgent/OrgInventoryAgent.csproj"
          (Get-Content $csproj -Raw) `
            -replace '<Version>[^<]*</Version>', "<Version>$v</Version>" `
            -replace '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$v.0</AssemblyVersion>" `
            -replace '<FileVersion>[^<]*</FileVersion>', "<FileVersion>$v.0</FileVersion>" |
            Set-Content $csproj -NoNewline -Encoding utf8
          # Core.dll cũng phải pin — AppInfo.Version đọc assembly version của Core,
          # sai lệch khiến auto-update so sánh sai (tải lặp) và --version báo sai.
          $core = "src/OrgInventoryAgent.Core/OrgInventoryAgent.Core.csproj"
          (Get-Content $core -Raw) `
            -replace '<Version>[^<]*</Version>', "<Version>$v</Version>" `
            -replace '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$v.0</AssemblyVersion>" `
            -replace '<FileVersion>[^<]*</FileVersion>', "<FileVersion>$v.0</FileVersion>" |
            Set-Content $core -NoNewline -Encoding utf8
          $wxs = "installer/Product.wxs"
          # -creplace: case-sensitive — version="1.0" trong <?xml decl phai giu nguyen chu thuong
          (Get-Content $wxs -Raw) -creplace 'Version="[\d.]+"', "Version=`"$v`"" |
            Set-Content $wxs -NoNewline -Encoding utf8
      - name: Build MSI
        shell: pwsh
        run: .\installer\build-msi.ps1
      - name: Sign MSI (nếu có cert)
        if: ${{ vars.MSI_CERT_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature installer\OrgInventoryAgent.msi
          if ($sig.Status -ne 'Valid') {
            Write-Host "Ký MSI bằng cert thumbprint từ vars.MSI_CERT_THUMBPRINT"
            & signtool sign /sha1 "${{ vars.MSI_CERT_THUMBPRINT }}" /fd sha256 /tr http://timestamp.digicert.com /td sha256 installer\OrgInventoryAgent.msi
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
            # Cập nhật sha256 sau khi ký (ký làm đổi binary)
            $h = (Get-FileHash installer\OrgInventoryAgent.msi -Algorithm SHA256).Hash.ToLower()
            "$h  OrgInventoryAgent.msi" | Set-Content installer\OrgInventoryAgent.msi.sha256 -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/OrgInventoryAgent.msi
            installer/OrgInventoryAgent.msi.sha256
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm dpkg-dev zstd
      - name: Pin version from tag
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i \
            -e "s|<Version>[^<]*</Version>|<Version>$V</Version>|" \
            -e "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$V.0</AssemblyVersion>|" \
            -e "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$V.0</FileVersion>|" \
            linux/src/OrgInventoryAgent.Linux/OrgInventoryAgent.Linux.csproj
          # Core.dll cũng phải pin (AppInfo.Version / UpdateService.CurrentVersion).
          sed -i \
            -e "s|<Version>[^<]*</Version>|<Version>$V</Version>|" \
            -e "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$V.0</AssemblyVersion>|" \
            -e "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$V.0</FileVersion>|" \
            src/OrgInventoryAgent.Core/OrgInventoryAgent.Core.csproj
          sed -i "s|^Version:.*|Version: $V|" installer/linux/debian/control
          sed -i "s|^Version:.*|Version:        $V|" installer/linux/rpm/orginventory.spec
      - name: Build self-contained binaries
        run: |
          V="${{ needs.version.outputs.version }}"
          ./installer/linux/build-linux.sh dist
          for RID in linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64; do
            mv "dist/$RID/OrgInventoryAgent" "dist/$RID/OrgInventoryAgent-$RID"
            (cd "dist/$RID" && sha256sum "OrgInventoryAgent-$RID" > "OrgInventoryAgent-$RID.sha256")
            echo "$V" > "dist/$RID/OrgInventoryAgent-$RID.version"
          done
      - name: Build deb + rpm + tarball + pacman + apk
        run: |
          ./installer/linux/build-deb.sh linux-x64 dist
          ./installer/linux/build-rpm.sh linux-x64 dist
          ./installer/linux/build-tarball.sh linux-x64 dist
          ./installer/linux/build-tarball.sh linux-arm64 dist
          ./installer/linux/build-pacman.sh linux-x64 dist
          ./installer/linux/build-apk.sh linux-musl-x64 dist
          ./installer/linux/build-apk.sh linux-musl-arm64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pin version from tag
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i '' \
            -e "s|<Version>[^<]*</Version>|<Version>$V</Version>|" \
            -e "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$V.0</AssemblyVersion>|" \
            -e "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$V.0</FileVersion>|" \
            macos/src/OrgInventoryAgent.MacOS/OrgInventoryAgent.MacOS.csproj
          sed -i '' \
            -e "s|<Version>[^<]*</Version>|<Version>$V</Version>|" \
            -e "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$V.0</AssemblyVersion>|" \
            -e "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$V.0</FileVersion>|" \
            src/OrgInventoryAgent.Core/OrgInventoryAgent.Core.csproj
      - name: Build self-contained binaries
        run: |
          V="${{ needs.version.outputs.version }}"
          ./installer/macos/build-macos.sh dist
          for RID in osx-x64 osx-arm64; do
            mv "dist/$RID/OrgInventoryAgent" "dist/$RID/OrgInventoryAgent-$RID"
            (cd "dist/$RID" && shasum -a 256 "OrgInventoryAgent-$RID" > "OrgInventoryAgent-$RID.sha256")
            echo "$V" > "dist/$RID/OrgInventoryAgent-$RID.version"
          done
      - name: Build .pkg (unsigned)
        run: |
          V="${{ needs.version.outputs.version }}"
          ./installer/macos/build-pkg.sh osx-x64 dist "$V"
          ./installer/macos/build-pkg.sh osx-arm64 dist "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  release:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: assets
      - name: Stage release assets (flatten — chỉ file, không thư mục staging)
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Windows MSI + checksum (artifact merge-multiple đặt file ở top-level assets/)
          cp assets/OrgInventoryAgent.msi assets/OrgInventoryAgent.msi.sha256 release-assets/
          # Linux + macOS single-file binaries + checksum + version sidecar
          for RID in linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 osx-x64 osx-arm64; do
            cp "assets/$RID/OrgInventoryAgent-$RID" \
               "assets/$RID/OrgInventoryAgent-$RID.sha256" \
               "assets/$RID/OrgInventoryAgent-$RID.version" release-assets/
          done
          # Packages (.deb + .tar.gz top-level; .rpm nằm sâu trong rpm/RPMS/<arch>/)
          cp assets/orginventory-agent_*.deb assets/orginventory-agent_*.tar.gz release-assets/
          find assets/rpm -name '*.rpm' -exec cp {} release-assets/ \;
          # Pacman (.pkg.tar.zst) + Alpine (.apk) + macOS .pkg
          cp assets/orginventory-agent-*.pkg.tar.zst release-assets/
          cp assets/orginventory-agent-*.apk release-assets/
          cp assets/orginventory-agent_*.pkg release-assets/
          # macOS launchd plists + apply-update + install script (backend download
          # endpoint phục vụ lại các file này cho đường curl|bash trên Mac).
          cp installer/macos/com.orginventory.agent.plist \
             installer/macos/com.orginventory.agent.update.plist release-assets/
          cp installer/macos/apply-update.sh release-assets/apply-update-macos.sh
          cp installer/macos/install.sh release-assets/install-macos.sh
          # Install scripts (canonical trên Releases)
          cp installer/install.sh installer/install.ps1 installer/install-both.ps1 \
             installer/offline/install-offline.ps1 installer/offline/install-offline.cmd \
             release-assets/
          ls -la release-assets/
      - name: Manifest agent-version.json
        run: |
          V="${{ needs.version.outputs.version }}"
          cat > release-assets/agent-version.json <<EOF
          {"msi_version": "$V", "linux": {"linux-x64": "$V", "linux-arm64": "$V", "linux-musl-x64": "$V", "linux-musl-arm64": "$V"}, "osx": {"osx-x64": "$V", "osx-arm64": "$V"}, "velociraptor_msi_version": null}
          EOF
          cat release-assets/agent-version.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "OrgInventory Agent $TAG" \
            --generate-notes \
            release-assets/*
