[workspace]
resolver = "2"
members = ["crates/agent-core", "crates/collectors-linux", "crates/collectors-macos", "crates/orginventory-agent"]

[workspace.package]
version = "1.3.1"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.80"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
collectors-linux = { path = "crates/collectors-linux" }
collectors-macos = { path = "crates/collectors-macos" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
log = { version = "0.4", features = ["std"] }
nix = { version = "0.29", features = ["net", "user", "fs", "hostname"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "deflate", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "process"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
